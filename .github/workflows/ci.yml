name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[profiles,test]"

      - name: Compile
        run: python -m compileall -q kutop kubetop tools

      - name: Lint
        run: ruff check

      - name: Unit tests
        run: pytest -q

      - name: CLI smoke tests
        run: |
          kutop --version
          kubetop --version
          python -m kutop --version
          python -m kubetop --version
          kutop --help
          kutop --dump-config --detail wide
          kutop --self-test --detail wide

      - name: Snapshot smoke test
        run: |
          NO_COLOR=1 kutop --snapshot /tmp/kutop-wide.svg --detail wide
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/kutop-wide.svg").read_text(encoding="utf-8")
          colors = {m.group(0).lower() for m in re.finditer(r"#[0-9a-fA-F]{6}", text)}
          non_gray = [
              color for color in colors
              if not (color[1:3] == color[3:5] == color[5:7])
          ]
          assert len(non_gray) >= 10, f"expected colored SVG, got {len(non_gray)} colors"
          PY

  # Non-blocking early warning: kutop pins textual/rich because it touches
  # Textual private internals (kutop/render/_compat.py). This job runs the
  # suite against the LATEST textual/rich so a breaking upstream change is
  # visible before a deliberate pin bump, without failing the required CI.
  latest-deps-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install with latest textual/rich
        run: |
          python -m pip install -e ".[profiles,test]"
          python -m pip install --upgrade textual rich

      - name: Smoke against latest deps
        run: |
          python -m kutop --self-test
          pytest -q
