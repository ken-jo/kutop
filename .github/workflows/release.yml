name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  build-deb:
    runs-on: ubuntu-latest
    needs: build-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Build Debian package
        run: |
          python -m pip install --upgrade pip
          ./packaging/deb/build-deb.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-homebrew:
    runs-on: ubuntu-latest
    needs: build-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Build Homebrew payload and formula
        run: |
          python -m pip install --upgrade pip
          ./packaging/homebrew/build-tarball.sh dist
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          print(re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE).group(1))
          PY
          )"
          TARBALL="dist/kutop-homebrew-${VERSION}.tar.gz"
          SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          python packaging/homebrew/render-formula.py \
            --version "$VERSION" \
            --tag "${GITHUB_REF_NAME}" \
            --sha256 "$SHA256" \
            --out Formula/kutop.rb
          mkdir -p homebrew-artifacts
          cp "$TARBALL" homebrew-artifacts/
          cp Formula/kutop.rb homebrew-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-package
          path: homebrew-artifacts/

  github-release:
    runs-on: ubuntu-latest
    needs: [build-python, build-deb, build-homebrew]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}"
          fi

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-python
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/kutop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-homebrew:
    runs-on: ubuntu-latest
    needs: [build-homebrew, github-release]
    if: ${{ vars.PUBLISH_HOMEBREW == 'true' }}
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'ken-jo/homebrew-tap' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-package
          path: homebrew-package/

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update tap formula
        run: |
          mkdir -p tap/Formula
          cp homebrew-package/kutop.rb tap/Formula/kutop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kutop.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
          else
            git commit -m "Update kutop to ${GITHUB_REF_NAME}"
            git push
          fi

  publish-apt:
    runs-on: ubuntu-latest
    needs: build-deb
    if: ${{ vars.PUBLISH_APT == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: deb/

      - name: Build signed apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            echo "APT_GPG_PRIVATE_KEY is required when PUBLISH_APT=true" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg
          mkdir -p public/apt/pool/main/k/kutop
          cp deb/*.deb public/apt/pool/main/k/kutop/
          mkdir -p public/apt/dists/stable/main/binary-all
          cd public/apt
          dpkg-scanpackages --arch all pool > dists/stable/main/binary-all/Packages
          gzip -9c dists/stable/main/binary-all/Packages > dists/stable/main/binary-all/Packages.gz
          apt-ftparchive release dists/stable > dists/stable/Release
          export GNUPGHOME="$(mktemp -d)"
          printf "%s" "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID="${APT_GPG_KEY_ID}"
          if [ -z "$KEY_ID" ]; then
            KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          fi
          gpg --armor --export "$KEY_ID" > kutop.gpg
          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE:-}" \
            --local-user "$KEY_ID" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE:-}" \
            --local-user "$KEY_ID" -abs -o dists/stable/Release.gpg dists/stable/Release

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
